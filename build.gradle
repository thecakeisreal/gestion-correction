/**
 * Configure le projet, les dépendances JavaFX et l'accès natif à l'exécution.
 * @author AI
 */
plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'ca.gestioncorrection'
version = '0.0.1'

repositories { mavenCentral() }

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

javafx {
    version = '21.0.6'
    modules = [ 'javafx.controls', 'javafx.fxml' ]
}

dependencies {
    implementation 'io.github.willena:sqlite-jdbc:3.47.2.0'
    implementation 'org.apache.poi:poi-ooxml:5.3.0'
    runtimeOnly 'org.slf4j:slf4j-simple:2.0.16'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'ca.gestioncorrection.Main'
    /** Autorise les bibliothèques natives JavaFX et SQLite au lancement de l'application. */
    applicationDefaultJvmArgs = ['--enable-native-access=javafx.graphics,ALL-UNNAMED']
}

/** Les tests chargent JavaFX et SQLite sur le classpath, dans le module non nommé. */
tasks.withType(Test).configureEach {
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}

/** Les scripts générés utilisent le classpath plutôt que le module nommé JavaFX. */
tasks.named('startScripts') {
    defaultJvmOpts = ['--enable-native-access=ALL-UNNAMED']
}

/** Inclut les mentions d'auteur dans la documentation générée. */
tasks.named('javadoc') {
    options.author = true
}

test {
    useJUnitPlatform { excludeTags 'ui' }
}

tasks.register('uiTest', Test) {
    description = 'Tests JavaFX avec affichage graphique.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'ui' }
}
